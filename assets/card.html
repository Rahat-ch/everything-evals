<title>Everything Evals card</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,600&family=Geist:wght@400;600&family=Geist+Mono:wght@400&display=swap">
<style>
/* Layout: two giant words stacked hard left, a red-pen strike and check as the only colour, one quiet line at the foot */
:root{
  --paper:#ffffff;
  --ink:#0b0b0b;
  --quiet:#6b6b6b;
  --pen:#e5322d;
  --display:"Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --sans:"Geist", "Helvetica Neue", Arial, sans-serif;
  --mono:"Geist Mono", ui-monospace, Menlo, monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1600px;height:900px;background:var(--paper);overflow:hidden}
body{color:var(--ink);font-family:var(--sans);padding:84px 110px 72px;display:flex;flex-direction:column}
.words{display:flex;flex-direction:column;gap:0}
.w{font-family:var(--display);font-size:310px;line-height:.84;font-weight:600;letter-spacing:-.035em;font-variation-settings:"opsz" 96;position:relative;display:inline-flex;align-items:center;width:max-content}
.w.vibes{color:var(--ink)}
.w svg{position:absolute;overflow:visible;pointer-events:none}
.strike{left:-30px;right:-40px;top:0;bottom:0;width:calc(100% + 70px);height:100%}
.check{width:210px;height:190px;position:relative!important;margin-left:36px;transform:translateY(-14px)}
.pen{fill:none;stroke:var(--pen);stroke-linecap:round;stroke-linejoin:round}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;gap:40px}
.name{font-size:34px;font-weight:600;letter-spacing:-.01em;display:flex;flex-direction:column;gap:6px;white-space:nowrap}
.name span{font-weight:400;color:var(--quiet);font-size:28px}
.url{font-family:var(--mono);font-size:24px;color:var(--ink);white-space:nowrap;padding-bottom:4px}
</style>
<div class="words">
  <div class="w vibes">vibes
    <svg class="strike" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <path class="pen" vector-effect="non-scaling-stroke" stroke-width="30" d="M1 60 C 20 55, 45 50, 62 49 S 92 44, 99 41"/>
    </svg>
  </div>
  <div class="w">evals<svg class="check" viewBox="0 0 110 100" aria-hidden="true">
      <path class="pen" stroke-width="15" d="M8 58 C 18 64, 28 76, 38 90 C 55 58, 78 26, 104 6"/>
    </svg></div>
</div>
<div class="foot">
  <div class="name">Everything Evals<span>Free resources from people who build AI</span></div>
  <div class="url">github.com/Rahat-ch/everything-evals</div>
</div>
